[package]
name = "runner-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["native"]
native = [
  "dep:async-trait",
  "dep:csv",
  "dep:evalexpr",
  "dep:futures",
  "dep:hex",
  "dep:jsonschema",
  "dep:rusqlite",
  "dep:sha2",
  "dep:tokio",
  "dep:tokio-util",
]

[dependencies]
async-trait = { version = "0.1.89", optional = true }
csv = { version = "1.3.1", optional = true }
evalexpr = { version = "13.1.0", optional = true }
futures = { version = "0.3.31", optional = true }
hex = { version = "0.4.3", optional = true }
jsonschema = { version = "0.49.9", default-features = false, optional = true }
petgraph = "0.8.2"
rusqlite = { version = "0.37.0", features = ["bundled"], optional = true }
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = { version = "0.10.9", optional = true }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }
tokio-util = { version = "0.7.16", optional = true }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true

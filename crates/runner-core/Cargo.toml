[package]
name = "runner-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.89"
evalexpr = "13.1.0"
futures = "0.3.31"
hex = "0.4.3"
jsonschema = { version = "0.49.9", default-features = false }
petgraph = "0.8.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.16"

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true

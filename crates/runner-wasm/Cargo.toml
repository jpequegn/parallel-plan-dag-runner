[package]
name = "runner-wasm"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
description = "Browser-safe plan validation and recorded-event replay for parallel-plan-dag-runner"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
runner-core = { path = "../runner-core", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen = "0.2.104"

[dev-dependencies]
runner-core = { path = "../runner-core", features = ["native"] }
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.16"

[lints]
workspace = true
